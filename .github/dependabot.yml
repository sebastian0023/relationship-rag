version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*']
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
