name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Validate grounded chat evaluation dataset
        run: npm run rag:chat-eval

      - name: Validate card grounding evaluation
        run: npm run rag:card-eval

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run card and inbox journey
        run: npm run test:e2e -- --project=chromium

      - name: Build
        run: npm run build

      - name: Synthesize infrastructure
        run: npm run synth -- --context stage=dev

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
