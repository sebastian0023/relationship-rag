name: Bootstrap test deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relationship-rag-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Check test deployment inputs
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_ROLE_ARN"
          test "$AWS_REGION" = us-east-1
          ALERT_EMAIL="$ALERT_EMAIL" node --input-type=module -e 'if (!/^\S+@\S+\.\S+$/.test(process.env.ALERT_EMAIL ?? "")) process.exit(1)'
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify AWS account
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - name: Reviewable test diff and deploy
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          npm run --workspace @relationship-rag/infrastructure synth -- --context stage=test --context alertEmail="$ALERT_EMAIL" >/dev/null
          npx cdk diff --app 'node apps/infrastructure/dist/bin/app.js' --context stage=test --context alertEmail="$ALERT_EMAIL" --all
          npx cdk deploy --app 'node apps/infrastructure/dist/bin/app.js' --context stage=test --context alertEmail="$ALERT_EMAIL" --all --require-approval never
      - name: Publish test frontend
        env:
          AWS_PAGER: ''
        run: bash scripts/publish-frontend.sh test
