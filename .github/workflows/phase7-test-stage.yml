name: Phase 7 test-stage validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relationship-rag-test
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Validate protected inputs
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_ROLE_ARN"
          test "$AWS_REGION" = us-east-1
          node scripts/phase7-live-inputs.mjs
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify AWS account
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - name: Deploy test stacks
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          npm run synth -- --context stage=test --context alertEmail="$ALERT_EMAIL" >/dev/null
          npx cdk diff --app 'node apps/infrastructure/dist/bin/app.js' --context stage=test --context alertEmail="$ALERT_EMAIL" --all
          npx cdk deploy --app 'node apps/infrastructure/dist/bin/app.js' --context stage=test --context alertEmail="$ALERT_EMAIL" --all --require-approval never
      - name: Publish frontend and runtime configuration
        id: frontend
        env:
          AWS_PAGER: ''
        run: bash scripts/publish-frontend.sh test
      - name: Record deployment target
        env:
          APP_URL: ${{ steps.frontend.outputs.app_url }}
        run: |
          echo "PHASE7_BASE_URL=$APP_URL" >> "$GITHUB_ENV"
          mkdir -p phase7-evidence
          # shellcheck disable=SC2016
          printf '# Phase 7 test-stage evidence\n\n- Commit: `%s`\n- Workflow run: `%s`\n- Region: `%s`\n- Started (UTC): `%s`\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$AWS_REGION" "$(date -u +%FT%TZ)" > phase7-evidence/run.md
      - run: npx playwright install --with-deps chromium
      - name: Run deployed authentication and accessibility smoke test
        env:
          PHASE7_TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          PHASE7_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run test:e2e:live
      - name: Publish alarm smoke metric
        run: npm run phase7:alarm-smoke -- --stage test --confirm | tee phase7-evidence/alarm-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-test-evidence
          path: phase7-evidence
