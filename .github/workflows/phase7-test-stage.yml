name: Phase 7 test-stage validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relationship-rag-phase7-test
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Validate protected inputs
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: node scripts/phase7-live-inputs.mjs
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy test stacks
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: npx cdk deploy --context stage=test --context "alertEmail=$ALERT_EMAIL" --all --require-approval never
      - name: Publish frontend and runtime configuration
        run: |
          node scripts/release/publish-stage.mjs test
          distribution_domain=$(aws cloudformation describe-stacks --stack-name relationship-rag-test-edge --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue | [0]" --output text)
          echo "PHASE7_BASE_URL=https://$distribution_domain" >> "$GITHUB_ENV"
          mkdir -p phase7-evidence
      - run: npx playwright install --with-deps chromium
      - name: Run deployed authentication and accessibility smoke test
        env:
          PHASE7_TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          PHASE7_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run test:e2e:live
      - name: Publish alarm smoke metric
        run: npm run phase7:alarm-smoke -- --stage test --confirm | tee phase7-evidence/alarm-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-test-evidence
          path: phase7-evidence
