name: Verify existing test stage

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relationship-rag-test
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:coverage
      - run: npm run test:fixtures
      - run: npm run test:backend:integration
      - run: npm run test:live:typecheck
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify account and test-stage URL
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PHASE7_BASE_URL: ${{ vars.TEST_BASE_URL }}
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          test -n "$PHASE7_BASE_URL"
      - name: Check authentication on every deployed route
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: npm run test:live:auth
      - name: Check deployed data and authorization controls
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: npm run test:live:preflight
      - run: npx playwright install --with-deps chromium
      - name: Verify live backend with both members
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PHASE7_BASE_URL: ${{ vars.TEST_BASE_URL }}
          LIVE_OWNER_USERNAME: ${{ secrets.LIVE_OWNER_USERNAME }}
          LIVE_OWNER_PASSWORD: ${{ secrets.LIVE_OWNER_PASSWORD }}
          LIVE_PARTNER_USERNAME: ${{ secrets.LIVE_PARTNER_USERNAME }}
          LIVE_PARTNER_PASSWORD: ${{ secrets.LIVE_PARTNER_PASSWORD }}
        run: npm run test:live:backend
      - name: Record cleanup manifest for recovery
        if: always()
        run: |
          if test -d .verification-runs; then
            for file in .verification-runs/*.json; do
              test -f "$file" || continue
              node -e 'const m=require(process.argv[1]); console.log(JSON.stringify({runId:m.runId,fixtureCount:m.fixtures.length}))' "./$file"
            done
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-run-manifest
          path: .verification-runs/*.json
          if-no-files-found: ignore
          retention-days: 30
