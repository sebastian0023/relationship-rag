openapi: 3.1.0
info:
  title: Relationship RAG API
  version: 0.1.0
  description: >-
    Private API contract. Schemas are implemented in packages/contracts. Application responses
    expose X-Correlation-Id; API Gateway may return a payload-independent 429 when stage or AI-route
    throttles are exceeded.
servers:
  - url: https://api.example.invalid
    description: Placeholder replaced by stage outputs
security:
  - cognitoJwt: []
paths:
  /me:
    get:
      operationId: getMe
      security:
        - cognitoJwt: [relationship-rag/access]
      responses:
        '200':
          description: Authenticated member profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /timeline:
    get:
      operationId: getTimeline
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Chronological memories for the authenticated couple
        '401':
          $ref: '#/components/responses/Unauthorized'
  /memories:
    post:
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
      responses:
        '201':
          description: Memory created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /memories/{memoryId}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      operationId: getMemory
      responses:
        '200': { description: Memory details }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemoryRequest'
      responses:
        '200': { description: Updated memory }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMemory
      responses:
        '202': { description: Memory removal and private-object cleanup accepted }
        '404': { $ref: '#/components/responses/NotFound' }
  /memories/{memoryId}/uploads:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: createMemoryUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201': { description: Five-minute presigned POST upload instructions }
  /memories/{memoryId}/photos/{photoId}:
    delete:
      operationId: deleteMemoryPhoto
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Photo cleanup accepted }
  /memories/{memoryId}/ingestion:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      operationId: getMemoryIngestion
      responses:
        '200': { description: Current ingestion status }
        '404': { $ref: '#/components/responses/NotFound' }
  /memories/{memoryId}/reindex:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: reindexMemory
      responses:
        '202': { description: Indexing accepted and status returned }
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: Private conversations for the authenticated user }
    post:
      operationId: createConversation
      responses:
        '201': { description: Conversation created }
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200': { description: Conversation with messages }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/messages:
    post:
      operationId: createMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201': { description: Grounded assistant response }
        '429': { $ref: '#/components/responses/Throttled' }
  /cards/generate:
    post:
      operationId: generateCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateCardRequest' }
      responses:
        '200':
          description: Generated unsaved editable draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedCardDraft' }
        '429': { $ref: '#/components/responses/Throttled' }
  /cards/recipients:
    get:
      operationId: listCardRecipients
      responses:
        '200': { description: Other active couple members eligible to receive a card }
  /cards:
    get:
      operationId: listCards
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: Sender-owned drafts and delivery history }
    post:
      operationId: saveCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveCardRequest' }
      responses:
        '201': { description: Saved card draft }
  /cards/{cardId}:
    get:
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: Sender-owned card }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCardRequest' }
      responses:
        '200': { description: Updated card }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Stale version or immutable card }
    delete:
      operationId: deleteCard
      parameters:
        - $ref: '#/components/parameters/CardId'
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Draft deleted }
        '409': { description: Stale version or immutable card }
  /cards/{cardId}/send:
    post:
      operationId: sendCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCardRequest' }
      responses:
        '202': { description: Delivery accepted }
  /inbox:
    get:
      operationId: getInbox
      responses:
        '200': { description: Recipient inbox }
  /inbox/{cardId}/read:
    patch:
      operationId: markInboxItemRead
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: Inbox item marked read }
  /inbox/{cardId}:
    get:
      operationId: getInboxItem
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: Delivered card for the authenticated recipient }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    cognitoJwt:
      type: openIdConnect
      openIdConnectUrl: https://cognito-idp.example.invalid/.well-known/openid-configuration
  parameters:
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    MemberProfile:
      type: object
      required: [userId, coupleId, role, displayName]
      properties:
        userId: { type: string }
        coupleId: { type: string }
        role: { type: string, enum: [OWNER, PARTNER] }
        displayName: { type: string }
    CreateMemoryRequest:
      type: object
      additionalProperties: false
      required: [title, occurredOn, body, locale]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        occurredOn: { type: string, format: date }
        body: { type: string, minLength: 1, maxLength: 10000 }
        locale: { type: string, enum: [en, es] }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
        category: { type: string, minLength: 1, maxLength: 40 }
        location: { type: string, minLength: 1, maxLength: 200 }
    UpdateMemoryRequest:
      allOf:
        - $ref: '#/components/schemas/CreateMemoryRequest'
        - type: object
          required: [version]
    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [requestId, question]
      properties:
        requestId: { type: string, format: uuid }
        question: { type: string, minLength: 1, maxLength: 2000 }
        filters:
          type: object
          properties:
            occurredOnFrom: { type: string, format: date }
            occurredOnTo: { type: string, format: date }
            category: { type: string, minLength: 1, maxLength: 40 }
            tags:
              type: array
              maxItems: 20
              items: { type: string, minLength: 1, maxLength: 40 }
          properties:
            version: { type: integer, minimum: 1 }
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [contentType, sizeBytes]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
    GenerateCardRequest:
      type: object
      additionalProperties: false
      required: [recipientUserId, occasion, tone, locale]
      properties:
        recipientUserId: { type: string }
        occasion: { type: string, minLength: 1, maxLength: 120 }
        tone: { type: string, enum: [AFFECTIONATE, PLAYFUL, GRATEFUL, REFLECTIVE] }
        locale: { type: string, enum: [en, es] }
        memoryIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    GeneratedCardDraft:
      type: object
      additionalProperties: false
      required: [title, body, citedMemoryIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        citedMemoryIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    SaveCardRequest:
      allOf:
        - $ref: '#/components/schemas/GenerateCardRequest'
        - $ref: '#/components/schemas/GeneratedCardDraft'
        - type: object
          required: [clientRequestId]
          properties:
            clientRequestId: { type: string, format: uuid }
    UpdateCardRequest:
      allOf:
        - $ref: '#/components/schemas/GenerateCardRequest'
        - $ref: '#/components/schemas/GeneratedCardDraft'
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    SendCardRequest:
      type: object
      additionalProperties: false
      required: [confirmed, version, idempotencyKey]
      properties:
        confirmed: { const: true }
        version: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
        deliveryAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
  headers:
    CorrelationId:
      description: Opaque API Gateway request identifier for privacy-safe support correlation
      schema: { type: string }
  responses:
    BadRequest:
      description: Request validation failed
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication is required
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The authenticated identity is not an active member
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InternalError:
      description: The profile service could not complete the request
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource does not exist within the authenticated tenancy
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Throttled:
      description: Stage or AI-route request rate exceeded
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
